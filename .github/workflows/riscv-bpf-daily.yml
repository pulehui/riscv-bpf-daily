# SPDX-License-Identifier: Apache-2.0
#
# RISC-V BPF daily test run.
#
# Manually triggered (workflow_dispatch). Builds the riscv-bpf-vmtest image
# (cached via GitHub Actions cache, pushed to GHCR so it survives across
# runs), runs the BPF selftests test_progs suite for riscv64 inside QEMU,
# and opens/comments a GitHub issue when tests fail.

name: riscv-bpf-daily

on:
  workflow_dispatch:
    inputs:
      bpf_ref:
        description: "kernel-patches/bpf ref to test (branch or tag)"
        required: false
        default: "bpf-next"

permissions:
  contents: read
  packages: write
  issues: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/riscv-bpf-vmtest

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image (cached)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.riscv-bpf-vmtest
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          # GitHub Actions cache: unchanged layers are reused, so the
          # expensive qemu/pahole/rootfs layers are rebuilt only when the
          # Dockerfile or context actually changes.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run BPF vmtest
        id: test
        # Stream the test output live to the Actions log (tee) while keeping a
        # copy in bpf_vmtest.stdout. `if: always()` is on the later steps so the
        # issue step still fires when this exits non-zero.
        run: |
          docker run --rm \
            -v "${PWD}:/repo" \
            -e BPF_REF="${{ inputs.bpf_ref }}" \
            "${{ env.IMAGE }}:latest" \
            bash /repo/scripts/run_bpf_tests.sh "${{ inputs.bpf_ref }}" \
            2>&1 | tee bpf_vmtest.stdout || true

          # Pull the in-container logs back to the runner.
          docker run --rm \
            -v "${PWD}:/out" \
            "${{ env.IMAGE }}:latest" \
            cat /workspace/bpf_vmtest.log > bpf_vmtest.log 2>/dev/null || true
          docker run --rm \
            -v "${PWD}:/out" \
            "${{ env.IMAGE }}:latest" \
            cat /workspace/bpf_error_logs.txt > bpf_error_logs.txt 2>/dev/null || true

          echo "===== runner stdout (error logs) ====="
          cat bpf_error_logs.txt 2>/dev/null || true
          echo "====================================="

          # The script writes the real exit code as the last line:
          #   "vmtest.sh exit code: N". If we cannot find it or it is non-zero,
          # mark the step failed so the issue step fires.
          rc=$(grep -E '^vmtest\.sh exit code: ' bpf_vmtest.stdout | tail -1 | awk '{print $NF}')
          # The bpf commit actually tested (line "bpf ref tested: <ref> @ <sha>").
          bpf_commit=$(grep -E '^bpf ref tested: ' bpf_vmtest.stdout | tail -1 | awk '{print $NF}')
          echo "bpf_commit=${bpf_commit}" >> "$GITHUB_OUTPUT"
          if [[ -z "${rc}" || "${rc}" != "0" ]]; then
            echo "test_status=failure" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "test_status=success" >> "$GITHUB_OUTPUT"

      - name: Upload test log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bpf_vmtest-log
          path: |
            bpf_vmtest.log
            bpf_vmtest.stdout
            bpf_error_logs.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Create failure issue
        if: always() && steps.test.outputs.test_status == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            // --- run date in +08:00, ISO YYYY-MM-DD ---
            // run_started_at is UTC; convert to Asia/Shanghai (UTC+8).
            const runDate = new Date(context.runStartedAt);
            const d8 = new Date(runDate.getTime() + 8 * 3600 * 1000);
            const dateStr = d8.getUTCFullYear() + '-' +
              String(d8.getUTCMonth() + 1).padStart(2, '0') + '-' +
              String(d8.getUTCDate()).padStart(2, '0');

            // --- 12-char commit: prefer the bpf commit actually tested;
            //     fall back to this repo's commit if clone failed early ---
            const bpfCommit40 = '${{ steps.test.outputs.bpf_commit }}';
            const repoCommit40 = context.sha;
            const commit12 = (bpfCommit40 || repoCommit40).slice(0, 12);

            const title = `Daily failed at ${dateStr} commit ${commit12}`;

            // --- focused error logs: the "All error logs:" block ---
            let errorLogs = '';
            try {
              errorLogs = fs.readFileSync('bpf_error_logs.txt', 'utf8').trim();
            } catch (_) { /* file may be missing */ }

            let errorSection;
            if (errorLogs) {
              errorSection = [
                `### Error logs`,
                '```',
                errorLogs,
                '```',
              ].join('\n');
            } else {
              // Fallback: tail of stdout when the All-error-logs block is absent.
              let stdoutTail = '';
              try {
                stdoutTail = fs.readFileSync('bpf_vmtest.stdout', 'utf8')
                  .split('\n').slice(-120).join('\n');
              } catch (_) { /* ignore */ }
              errorSection = [
                `### Error logs`,
                `_(All error logs 段缺失，以下为 stdout 末尾兜底)_`,
                '```',
                stdoutTail,
                '```',
              ].join('\n');
            }

            // --- bpf tested line (omit link if we never got the commit) ---
            const bpfRef = '${{ inputs.bpf_ref }}';
            const bpfLine = bpfCommit40
              ? `**bpf tested:** \`${bpfRef}@${bpfCommit40}\` (https://github.com/kernel-patches/bpf/commit/${bpfCommit40})`
              : `**bpf ref tested:** \`${bpfRef}\``;

            const body = [
              `## RISC-V BPF vmtest failed`,
              ``,
              `- **Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `- ${bpfLine}`,
              `- **repo commit:** \`${repoCommit40}\``,
              ``,
              errorSection,
              ``,
              `Full log: \`bpf_vmtest-log\` artifact of run ${context.runId}.`,
            ].join('\n');

            // Each bpf version gets its own issue (title carries the commit).
            const { data: issue } = await github.rest.issues.create({
              ...context.repo,
              title,
              body,
              labels: ['bpf-vmtest', 'riscv64'],
            });
            core.info(`Created issue #${issue.number}: ${title}`);
