# SPDX-License-Identifier: Apache-2.0
#
# RISC-V BPF daily test run.
#
# Manually triggered (workflow_dispatch). Builds the riscv-bpf-vmtest image
# (cached via GitHub Actions cache, pushed to GHCR so it survives across
# runs), runs the BPF selftests test_progs suite for riscv64 inside QEMU,
# and opens/comments a GitHub issue when tests fail.

name: riscv-bpf-daily

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  issues: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/riscv-bpf-vmtest

jobs:
  vmtest-riscv64:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync Runner Image
        run: bash ./scripts/sync_image.sh

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ccache-dir
          key: ccache-riscv64-${{ github.run_id }}
          restore-keys: |
            ccache-riscv64-

      - name: Run test_progs
        id: test
        run: bash ./scripts/run_ci_test.sh

      - name: Archive Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bpf_vmtest-log
          path: |
            bpf_vmtest.log
            bpf_vmtest.stdout
            bpf_error_logs.txt
          if-no-files-found: warn
          retention-days: 30

      - name: File Issue
        if: always() && steps.test.outputs.test_status == 'failure'
        uses: actions/github-script@v7
        env:
          BPF_COMMIT: ${{ steps.test.outputs.bpf_commit }}
        with:
          script: |
            const fileIssue = require('./scripts/file_issue.js');
            await fileIssue({ github, context, core });
