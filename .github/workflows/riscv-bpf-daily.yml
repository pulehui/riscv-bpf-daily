#
# RISC-V BPF test run for daily builds and pull requests.

name: riscv-bpf-daily

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read
  packages: write
  issues: write
  pull-requests: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/riscv-bpf-vmtest

jobs:
  vmtest-riscv64:
    if: github.event_name != 'pull_request' || github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync Runner Image
        run: bash ./scripts/sync_image.sh

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ccache-dir
          key: ccache-riscv64-${{ github.run_id }}
          restore-keys: |
            ccache-riscv64-

      - name: Setup Tree
        id: setup
        run: bash ./scripts/run_ci.sh setup

      - name: Run test_progs
        id: test_progs
        run: bash ./scripts/run_ci.sh test_progs

      - name: Run test_verifier
        id: test_verifier
        run: bash ./scripts/run_ci.sh test_verifier

      - name: Archive Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bpf_vmtest-log
          path: |
            *.log
            *.stdout
            *_errors.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Report Failure
        if: failure()
        uses: actions/github-script@v7
        env:
          BPF_BASE_COMMIT: ${{ steps.setup.outputs.bpf_base_commit }}
          TEST_PROGS_STATUS: ${{ steps.test_progs.outcome }}
          TEST_VERIFIER_STATUS: ${{ steps.test_verifier.outcome }}
        with:
          script: |
            const reportFailure = require('./scripts/file_issue.js');
            await reportFailure({ github, context, core });
